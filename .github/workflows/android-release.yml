name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build and sign release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          REPO_UPDATES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          REPO_UPDATES_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_ALIAS }}
        run: |
          set -eu
          if [[ -z "$KEYSTORE_BASE64" || -z "$REPO_UPDATES_KEYSTORE_PASSWORD" || -z "$REPO_UPDATES_KEY_ALIAS" ]]; then
            printf 'Release signing secrets are missing.\n' >&2
            exit 1
          fi
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/repoupdates.XXXXXX.p12")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset KEYSTORE_BASE64
          export REPO_UPDATES_KEYSTORE_PATH="$keystore"
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK and name artifact
        id: package
        run: |
          set -eu
          apk=$(./scripts/package-release.sh app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/signed-apk")
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Push signed APK to MessagePush
        env:
          MESSAGE_PUSH_URL: ${{ secrets.MESSAGE_PUSH_URL }}
          MESSAGE_PUSH_API_TOKEN: ${{ secrets.MESSAGE_PUSH_API_TOKEN }}
          MESSAGE_PUSH_CHANNEL_ID: RepoUpdate
          APK_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          if [[ -z "$MESSAGE_PUSH_URL" || -z "$MESSAGE_PUSH_API_TOKEN" ]]; then
            printf 'MessagePush URL or API token is missing.\n' >&2
            exit 1
          fi
          if [[ ! -s "$APK_PATH" ]]; then
            printf 'Signed APK is missing.\n' >&2
            exit 1
          fi

          revision=$(git log -1 --format='%h %s')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          caption=$(printf '### 仓库更新构建完成\n\n- APK：`%s`\n- 提交：%s\n\n[查看 GitHub Actions 构建](%s)' "${APK_PATH##*/}" "$revision" "$run_url")
          status=$(
            printf 'X-API-Token: %s\n' "$MESSAGE_PUSH_API_TOKEN" |
              curl --silent --show-error --connect-timeout 15 --max-time 180 \
                --output /dev/null --write-out '%{http_code}' --header @- \
                --form-string "channelId=$MESSAGE_PUSH_CHANNEL_ID" \
                --form-string "caption=$caption" \
                --form "files=@$APK_PATH;type=application/vnd.android.package-archive" \
                "${MESSAGE_PUSH_URL%/}/api/upload"
          )
          if [[ "$status" != 201 ]]; then
            printf 'MessagePush upload failed (HTTP %s).\n' "$status" >&2
            exit 1
          fi
          printf 'MessagePush accepted the signed APK for %s (HTTP 201).\n' "$MESSAGE_PUSH_CHANNEL_ID"
