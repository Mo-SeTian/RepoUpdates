plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseKeystore = providers.environmentVariable('REPO_UPDATES_KEYSTORE_PATH').orNull

android {
    namespace 'dev.repoupdates.app'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.repoupdates.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    if (releaseKeystore != null) {
        def releasePassword = providers.environmentVariable('REPO_UPDATES_KEYSTORE_PASSWORD').orNull
        def releaseAlias = providers.environmentVariable('REPO_UPDATES_KEY_ALIAS').orNull
        if (!releasePassword || !releaseAlias) {
            throw new GradleException('Release signing requires a keystore password and key alias.')
        }
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storeType 'PKCS12'
                storePassword releasePassword
                keyAlias releaseAlias
                keyPassword releasePassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'top.yukonga.miuix.kmp:miuix:0.8.8'
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.8.8'
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'
    implementation 'io.noties.markwon:core:4.6.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
